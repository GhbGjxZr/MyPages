<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简洁导航</title>

    <!-- =============================================================
    📌 数据区 — 放在 CSS 样式的最前面！
       一打开代码就能看到，方便修改
    ============================================================= -->
    <script>
        // 所有链接数据 — 直接在这里增删改
        const linksData = [
			{
                // ← 卡片上显示的大标题
				title: "网页源码",
                // ← 卡片上的描述文字
				description: "GitHub源码",
                // ← 点击卡片跳转到这里
				url: "https://github.com/GhbGjxZr/MyPages",
                // ← 卡片顶部的图标
				icon: "📊"
			},
			{
                // ← 卡片上显示的大标题
				title: "Gitee仓库快速删除",
                // ← 卡片上的描述文字
				description: "一键删除Gitee仓库",
                // ← 点击卡片跳转到这里
				url: "https://html-projects-d5x.pages.dev/gitee-del",
                // ← 卡片顶部的图标
				icon: "🗑️"
			},
			{
                // ← 卡片上显示的大标题
				title: "GitHub仓库快速删除",
                // ← 卡片上的描述文字
				description: "一键删除GitHub仓库",
                // ← 点击卡片跳转到这里
				url: "https://html-projects-d5x.pages.dev/github-del",
                // ← 卡片顶部的图标
				icon: "🗑️"
			},
			{
                // ← 卡片上显示的大标题
				title: "高一数学",
                // ← 卡片上的描述文字
				description: "高一数学",
                // ← 点击卡片跳转到这里
				url: "https://html-projects-d5x.pages.dev/math-grade10",
                // ← 卡片顶部的图标
				icon: "📖"
			},
        ];

        // 如需新增，直接在上面数组里添加对象，例如：
        // { title: "新站点", description: "描述", url: "https://example.com", icon: "🚀" }
    </script>

    <style>
        /* ---------- 极简重置 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f3f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .app {
            max-width: 1200px;
            width: 100%;
            background: #ffffff;
            border-radius: 2rem;
            padding: 2rem 2.2rem 2.2rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        }

        /* 头部 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid #eceff5;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #1e293b;
            letter-spacing: -0.02em;
        }

        .header .count {
            font-size: 0.85rem;
            color: #64748b;
            background: #f1f4f9;
            padding: 0.25rem 1rem;
            border-radius: 40px;
        }

        /* 卡片网格 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.2rem;
        }

        /* 卡片 — 整卡可点击 */
        .card {
            display: block;
            background: #f8fafc;
            border-radius: 1.2rem;
            padding: 1rem 1rem 1.1rem;
            text-decoration: none;
            color: #0f172a;
            border: 1px solid #e9edf4;
            transition: background 0.15s, border-color 0.15s, transform 0.12s;
            cursor: pointer;
        }

        .card:hover {
            background: #ffffff;
            border-color: #cbd5e1;
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.02);
        }

        /* 图标 */
        .card .icon {
            font-size: 1.6rem;
            line-height: 1;
            margin-bottom: 0.3rem;
            display: block;
        }

        /* iframe 预览 */
        .card .preview {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            border-radius: 0.8rem;
            overflow: hidden;
            background: #eef2f6;
            margin-bottom: 0.6rem;
        }

        .card .preview iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 0.8rem;
            background: #fff;
            pointer-events: none;
            opacity: 0.8;
        }

        .card:hover .preview iframe {
            opacity: 0.95;
        }

        /* 卡片文字 */
        .card .info {
            padding: 0 0.1rem;
        }

        .card .title {
            font-weight: 600;
            font-size: 0.95rem;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .card .title .domain {
            font-weight: 400;
            font-size: 0.65rem;
            color: #64748b;
            background: #eef2f6;
            padding: 0.05rem 0.5rem;
            border-radius: 30px;
        }

        .card .desc {
            font-size: 0.78rem;
            color: #475569;
            margin-top: 0.15rem;
            opacity: 0.8;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* 底部 */
        .footer {
            margin-top: 1.8rem;
            text-align: right;
            font-size: 0.75rem;
            color: #94a3b8;
            border-top: 1px solid #eceff5;
            padding-top: 0.9rem;
        }

        .footer strong {
            color: #64748b;
            font-weight: 500;
        }

        /* 空状态 */
        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 2.5rem 0;
            color: #94a3b8;
            background: #f8fafc;
            border-radius: 1.5rem;
        }

        /* 响应式 */
        @media (max-width: 500px) {
            .app {
                padding: 1.2rem 1rem;
                border-radius: 1.5rem;
            }
            .grid {
                grid-template-columns: 1fr 1fr;
                gap: 0.8rem;
            }
            .header h1 {
                font-size: 1.4rem;
            }
        }

        @media (max-width: 400px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="app">
    <!-- 头部 -->
    <div class="header">
        <h1>📌 导航</h1>
        <span class="count" id="count">0 个</span>
    </div>

    <!-- 卡片网格 -->
    <div class="grid" id="grid"></div>

    <!-- 底部 -->
    <div class="footer">
        <span>✏️ 修改顶部 <strong>linksData</strong> 数组</span>
    </div>
</div>

<script>
    (function() {
        "use strict";

        // ----- 渲染逻辑 (无需修改) -----
        const grid = document.getElementById('grid');
        const countEl = document.getElementById('count');

        function getDomain(url) {
            try {
                const u = new URL(url);
                return u.hostname.replace(/^www\./, '');
            } catch (_) {
                return url;
            }
        }

        function render() {
            grid.innerHTML = '';

            if (!linksData || linksData.length === 0) {
                grid.innerHTML = `<div class="empty">📭 暂无链接，请在 linksData 中添加</div>`;
                countEl.textContent = '0 个';
                return;
            }

            linksData.forEach((item) => {
                const title = item.title || '未命名';
                const desc = item.description || ' ';
                const url = item.url || '#';
                const icon = item.icon || '🔗';

                const card = document.createElement('a');
                card.className = 'card';
                card.href = url;
                card.target = '_blank';
                card.rel = 'noopener noreferrer';

                card.innerHTML = `
                    <span class="icon">${icon}</span>
                    <div class="preview">
                        <iframe src="${url}" loading="lazy" title="${title}"></iframe>
                    </div>
                    <div class="info">
                        <div class="title">
                            ${title}
                            <span class="domain">${getDomain(url)}</span>
                        </div>
                        <div class="desc">${desc}</div>
                    </div>
                `;

                grid.appendChild(card);
            });

            countEl.textContent = `${linksData.length} 个`;
        }

        render();

        // 暴露到控制台方便调试
        window.render = render;

        console.log('✅ 导航已启动');
        console.log('📌 数据在顶部 linksData 数组中 (在 <style> 之上)');
        console.log('💡 添加: linksData.push({ title, description, url, icon }); 然后执行 render();');
    })();
</script>
</body>
</html>
